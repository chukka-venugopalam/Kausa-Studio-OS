name: Agent Daily Pipeline

on:
  repository_dispatch:
    types: [run-agent]
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to run"
        required: true
        default: "verification_agent"
      chain_id:
        description: "Chain ID (verification_agent)"
        required: false
      claim:
        description: "Claim text (verification_agent)"
        required: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_NAME: ${{ github.event.client_payload.agent || inputs.agent }}
          CHAIN_ID: ${{ github.event.client_payload.chain_id || inputs.chain_id }}
          CLAIM: ${{ github.event.client_payload.claim || inputs.claim }}
        run: python -m scripts.run_agent